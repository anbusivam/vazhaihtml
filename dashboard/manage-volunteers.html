<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manage Volunteers — Vazhai</title>
<link rel="icon" href="/images/favicon_io/favicon.ico"><link rel="stylesheet" href="/css/style.css">
<style>
  :root { --green:#4a7c59; --green-dark:#2d5a3f; --green-light:#e8f5e9; --green-bg:#f0f9f0; --text:#333; --muted:#666; --border:#ddd; }
  * { box-sizing:border-box; } body { margin:0; background:var(--green-bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif; }
  .head { background:#fff; border-bottom:1px solid var(--border); padding:16px 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .head h1 { margin:0; color:var(--green-dark); font-size:20px; } .head .email { font-weight:700; color:var(--green-dark); }
  .nav { padding:10px 20px; background:#fff; border-bottom:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap; }
  .nav a { color:var(--green-dark); background:var(--green-light); padding:6px 12px; border-radius:6px; text-decoration:none; font-size:13px; }
  .wrap { padding:24px 16px; } .panel { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; } .toolbar input,.toolbar select { border:2px solid var(--border); border-radius:8px; padding:10px 12px; font:inherit; min-width:220px; }
  button { border:0; border-radius:8px; padding:10px 16px; cursor:pointer; font:inherit; font-weight:700; } .primary { background:var(--green-dark); color:#fff; } .secondary { background:#fff; color:var(--green-dark); border:2px solid var(--green-dark); } .danger { background:#d32f2f; color:#fff; }
  .msg { display:none; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px; } .msg.success { display:block; background:var(--green-light); color:var(--green-dark); } .msg.error { display:block; background:#fff0f0; color:#b71c1c; }
  .table-wrap { overflow:auto; } table { width:100%; border-collapse:collapse; min-width:1100px; font-size:13px; } th { text-align:left; padding:10px 8px; border-bottom:2px solid var(--border); color:var(--muted); font-size:11px; text-transform:uppercase; } td { padding:10px 8px; border-bottom:1px solid #eee; vertical-align:top; } .small { color:var(--muted); font-size:12px; line-height:1.5; } .chips { color:var(--green-dark); line-height:1.5; }
  td select, td textarea { width:100%; border:1px solid var(--border); border-radius:6px; padding:6px; font:inherit; } td textarea { min-height:58px; resize:vertical; } .actions { display:flex; gap:6px; flex-direction:column; }
  .empty { padding:40px; text-align:center; color:var(--muted); } @media(max-width:640px) { .head { align-items:flex-start; flex-direction:column; } .toolbar input,.toolbar select { min-width:100%; } }
</style>
</head>
<body>
<header class="head"><h1>👥 Volunteer Registrations</h1><div>Signed in as <span id="admin-email" class="email"></span> <button class="secondary" onclick="logout()">Sign Out</button></div></header>
<nav class="nav"><a href="/dashboard/manage">⚙️ Admin Dashboard</a><a href="/dashboard/manage-users">👤 Users</a><a href="/dashboard/manage-backup">💾 Backup & Restore</a><a href="/">🏠 Home</a></nav>
<main class="wrap"><section class="panel"><div id="msg" class="msg"></div><div class="toolbar"><input id="search" type="search" placeholder="Search name, email, phone, city"><select id="status-filter"><option value="">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="active">Active</option><option value="closed">Closed</option></select><button class="primary" onclick="loadVolunteers()">Refresh</button></div><div id="table-wrap" class="table-wrap"></div></section></main>
<script>
let records = [];
const labels = { 'learning-materials':'Learning materials', 'career-conversation':'Career story', 'catch-up-support':'Catch-up support', 'student-projects':'Student projects', 'college-guidance':'College applications', 'employment-exchange':'Employment Exchange', 'outreach':'Outreach', 'explore':'Join, observe and learn' };
function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
function show(type, text) { const el = document.getElementById('msg'); el.className = text ? 'msg ' + type : 'msg'; el.textContent = text; }
async function auth() { const response = await fetch('/auth/check'); const data = await response.json(); if (!data.authenticated) { location.href='/login'; return false; } const admin = data.roles ? data.roles.includes('admin') : data.role === 'admin'; if (!admin) { show('error','Admin access required.'); setTimeout(() => location.href='/', 1800); return false; } document.getElementById('admin-email').textContent = data.email; return true; }
async function loadVolunteers() { const params = new URLSearchParams(); const search = document.getElementById('search').value.trim(); const status = document.getElementById('status-filter').value; if (search) params.set('search', search); if (status) params.set('status', status); const token = localStorage.getItem('vazhai_session'); const headers = token ? { Authorization:'Bearer ' + token } : {}; try { const response = await fetch('/volunteer/manage?' + params, { headers }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Unable to load registrations.'); records = data.volunteers || []; render(); } catch (error) { show('error', error.message); } }
function render() { const wrap = document.getElementById('table-wrap'); if (!records.length) { wrap.innerHTML = '<div class="empty">No volunteer registrations found.</div>'; return; } wrap.innerHTML = '<table><thead><tr><th>ID / Date</th><th>Volunteer</th><th>Details</th><th>Interests</th><th>Status</th><th>Admin notes</th><th>Actions</th></tr></thead><tbody>' + records.map(record => `<tr data-id="${escapeHtml(record.id)}"><td><strong>${escapeHtml(record.id)}</strong><div class="small">${escapeHtml(new Date(record.createdAt).toLocaleString())}</div></td><td><strong>${escapeHtml(record.name)}</strong><div class="small">${escapeHtml(record.email)}<br>${escapeHtml(record.phone)}<br>${escapeHtml(record.city)}</div></td><td class="small">${escapeHtml(record.qualification)}<br>${escapeHtml(record.ageGroup)}<br>${escapeHtml(record.availability)}${record.comments ? '<br><br>' + escapeHtml(record.comments) : ''}</td><td class="chips">${(record.interests || []).map(item => escapeHtml(labels[item] || item)).join('<br>')}</td><td><select class="status"><option value="new" ${record.status==='new'?'selected':''}>New</option><option value="contacted" ${record.status==='contacted'?'selected':''}>Contacted</option><option value="active" ${record.status==='active'?'selected':''}>Active</option><option value="closed" ${record.status==='closed'?'selected':''}>Closed</option></select></td><td><textarea class="notes">${escapeHtml(record.notes)}</textarea></td><td class="actions"><button class="primary" onclick="saveRecord('${escapeHtml(record.id)}')">Save</button><button class="danger" onclick="deleteRecord('${escapeHtml(record.id)}')">Delete</button></td></tr>`).join('') + '</tbody></table>'; }
async function saveRecord(id) { const row = document.querySelector(`tr[data-id="${CSS.escape(id)}"]`); const token = localStorage.getItem('vazhai_session'); const response = await fetch('/volunteer/manage', { method:'POST', headers:{'Content-Type':'application/json', ...(token ? {Authorization:'Bearer ' + token}: {})}, body:JSON.stringify({action:'update', id, status:row.querySelector('.status').value, notes:row.querySelector('.notes').value}) }); const data = await response.json(); if (!response.ok) { show('error',data.error || 'Unable to save.'); return; } show('success','Registration updated.'); await loadVolunteers(); }
async function deleteRecord(id) { if (!confirm('Delete this volunteer registration? This cannot be undone.')) return; const token = localStorage.getItem('vazhai_session'); const response = await fetch('/volunteer/manage', { method:'POST', headers:{'Content-Type':'application/json', ...(token ? {Authorization:'Bearer ' + token}: {})}, body:JSON.stringify({action:'delete', id}) }); const data = await response.json(); if (!response.ok) { show('error',data.error || 'Unable to delete.'); return; } show('success','Registration deleted.'); await loadVolunteers(); }
async function logout() { const token = localStorage.getItem('vazhai_session'); await fetch('/auth/logout',{method:'POST',headers:token?{Authorization:'Bearer '+token}:{}}).catch(()=>{}); localStorage.removeItem('vazhai_session'); location.href='/'; }
document.addEventListener('DOMContentLoaded', async () => { if (await auth()) loadVolunteers(); });
</script>
</body>
</html>
