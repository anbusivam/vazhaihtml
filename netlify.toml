[build]
  command = "echo 'static site with serverless functions'"
  publish = "."

# Cache static assets for 1 year (31536000 seconds)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/**/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/donate/order"
  to = "/.netlify/functions/donate-order"
  status = 200

[[redirects]]
  from = "/donate/verify"
  to = "/.netlify/functions/donate-verify"
  status = 200

[[redirects]]
  from = "/donate/subscribe"
  to = "/.netlify/functions/donate-subscribe"
  status = 200

[[redirects]]
  from = "/donate/verify-subscription"
  to = "/.netlify/functions/donate-verify-subscription"
  status = 200

# Clean URL rewrites (status=200 means internal rewrite, no client redirect)
[[redirects]]
  from = "/who-we-are"
  to = "/who-we-are.html"
  status = 200

[[redirects]]
  from = "/what-we-do"
  to = "/what-we-do.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200

[[redirects]]
  from = "/auth/send-otp"
  to = "/.netlify/functions/auth-send-otp"
  status = 200

[[redirects]]
  from = "/auth/verify-otp"
  to = "/.netlify/functions/auth-verify-otp"
  status = 200

[[redirects]]
  from = "/auth/check"
  to = "/.netlify/functions/auth-check"
  status = 200

[[redirects]]
  from = "/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Root fallback
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
